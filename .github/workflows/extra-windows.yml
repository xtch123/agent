name: Extra Windows x64 agent

# Independently follows Yeqingky/monitor-agent-win releases.
# Linux releases are managed by extra-linux.yml and remain GitHub "Latest"
# for the Linux installer using releases/latest/download.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/extra-windows.yml
      - WINDOWS-EXTRA.md
  schedule:
    - cron: '47 4 * * *'

permissions:
  contents: read

concurrency:
  group: extra-windows-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.windows.outputs.tag }}
      build: ${{ steps.windows.outputs.build }}
    steps:
      - name: Find the latest Windows port version independently
        id: windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo Yeqingky/monitor-agent-win --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Unexpected Windows release tag: $tag"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          release="windows-$tag"
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            names="$(gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$names" | grep -Fxq 'monitor-agent-x86_64-pc-windows-gnu.exe' &&
               printf '%s\n' "$names" | grep -Fxq 'SHA256SUMS'; then
              echo "$release already has its Windows binary and checksum." >> "$GITHUB_STEP_SUMMARY"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Windows port at its own release tag
        uses: actions/checkout@v7
        with:
          repository: Yeqingky/monitor-agent-win
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Verify source version and licence
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "v$version" = "$TAG"
          grep -qx 'license = "MIT"' Cargo.toml
          test -s LICENSE

      - name: Install GNU Windows build toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt

      - name: Check upstream Windows port
        run: |
          cargo fmt --all --check
          cargo check --locked --target x86_64-pc-windows-gnu
          cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets -- -D warnings

      - name: Build Windows x64 EXE
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-pc-windows-gnu
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/monitor-agent.exe dist/monitor-agent-x86_64-pc-windows-gnu.exe
          file dist/*.exe | grep -q 'PE32+'
          test -s dist/monitor-agent-x86_64-pc-windows-gnu.exe

      - uses: actions/upload-artifact@v4
        with:
          name: independent-windows-x64
          path: dist/monitor-agent-x86_64-pc-windows-gnu.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: independent-windows-x64
          path: dist

      - name: Publish Windows-only release without changing Linux Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          release="windows-$TAG"
          binary="monitor-agent-x86_64-pc-windows-gnu.exe"
          test -s "dist/$binary"
          (cd dist && sha256sum "$binary" > SHA256SUMS)
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Recovery if a previous release publication was incomplete.
            gh release upload "$release" "dist/$binary" dist/SHA256SUMS \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release" "dist/$binary" dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "Windows x64 agent ($TAG)" \
              --notes "Unofficial Windows x64 build of Yeqingky/monitor-agent-win $TAG (MIT). Windows port versions advance independently of the official Linux agent; verify Hub protocol compatibility before deploying. This executable is unsigned." \
              --latest=false
          fi
          echo "Windows $TAG published at $release; Linux releases and Latest remain untouched." >> "$GITHUB_STEP_SUMMARY"
